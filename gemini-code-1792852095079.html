function cargarPlanillaAranceles(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const txt = e.target.result;
      let data = null;
      if(file.name.endsWith('.json') || txt.trim().startsWith('{')){
        data = JSON.parse(txt);
      } else {
        const matches = txt.match(/[\d.]+/g);
        if(matches && matches.length>0){
          data = { T: matches[0] };
        }
      }
      if(data){
        if(data.T || data.valor_base || data.T0){
          const val = data.T || data.valor_base || data.T0;
          $('T').value = (typeof val === 'number') ? val.toLocaleString('es-AR') : val.toString();
        }
        if(data.rc !== undefined) $('rc').value = data.rc;
        if(data.rr !== undefined) $('rr').value = data.rr;
        if(data.rk !== undefined) $('rk').value = data.rk;
        if(data.r1 !== undefined) $('r1').value = data.r1;
        if(data.r2 !== undefined) $('r2').value = data.r2;
        if(data.r3 !== undefined) $('r3').value = data.r3;
        if(data.DEST) Object.assign(DEST, data.DEST);
        if(data.HON) Object.assign(HON, data.HON);
        
        $('lbl_aranceles_status').style.color = 'var(--ok)';
        $('lbl_aranceles_status').textContent = '✓ Planilla cargada: ' + file.name;
        stale();
      } else {
        throw new Error('Formato no reconocido');
      }
    } catch(err){
      $('lbl_aranceles_status').style.color = '#b3261e';
      $('lbl_aranceles_status').textContent = '✕ Error al procesar el archivo';
    }
  };
